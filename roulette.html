<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>포인트 룰렛 이벤트</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  background: #f6f6f6;
  text-align: center;
  padding: 20px;
}
h1 {
  margin-bottom: 5px;
}
#wheel-container {
  position: relative;
  width: 280px;
  height: 280px;
  margin: 30px auto;
}
#wheel {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 8px solid #333;
  transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
}
.pointer {
  position: absolute;
  top: -16px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 16px solid transparent;
  border-right: 16px solid transparent;
  border-bottom: 32px solid #ff3b3b;
}
button {
  background: #ff6b00;
  color: #fff;
  border: none;
  padding: 14px 28px;
  font-size: 18px;
  border-radius: 8px;
  cursor: pointer;
}
button:disabled {
  background: #aaa;
}
#result {
  margin-top: 20px;
  font-size: 18px;
  font-weight: bold;
}
.notice {
  margin-top: 12px;
  font-size: 14px;
  color: #555;
}
</style>
</head>

<body>

<h1>🎡 포인트 룰렛 이벤트</h1>
<p>하루 1회 참여 가능</p>

<div id="wheel-container">
  <div class="pointer"></div>

  <!-- 룰렛 -->
  <svg id="wheel" viewBox="0 0 100 100">
    <!-- 5천 포인트 60% (216도) -->
    <path d="M50 50 L50 0 A50 50 0 1 1 6.7 25 Z" fill="#FFD54F"/>
    <!-- 1만 포인트 30% (108도) -->
    <path d="M50 50 L6.7 25 A50 50 0 0 1 93.3 25 Z" fill="#4FC3F7"/>
    <!-- 5만 포인트 10% (36도) -->
    <path d="M50 50 L93.3 25 A50 50 0 0 1 50 0 Z" fill="#FF8A65"/>

    <!-- 텍스트 -->
    <text x="50" y="18" font-size="6" text-anchor="middle">5천P</text>
    <text x="18" y="62" font-size="6" text-anchor="middle">1만P</text>
    <text x="82" y="62" font-size="6" text-anchor="middle">5만P</text>
  </svg>
</div>

<button id="spinBtn">룰렛 돌리기</button>

<div id="result"></div>
<div class="notice" id="notice"></div>

<script>
const spinBtn = document.getElementById("spinBtn");
const wheel = document.getElementById("wheel");
const result = document.getElementById("result");
const notice = document.getElementById("notice");

/* 보상 + 확률 + 포인터 기준 각도 */
const rewards = [
  { name: "5천 포인트", weight: 60, angle: 270 },
  { name: "1만 포인트", weight: 30, angle: 150 },
  { name: "5만 포인트", weight: 10, angle: 30 }
];

function hasPlayedToday() {
  const saved = localStorage.getItem("rouletteDate");
  const today = new Date().toISOString().slice(0, 10);
  return saved === today;
}

function getReward() {
  const rand = Math.random() * 100;
  let sum = 0;
  for (let r of rewards) {
    sum += r.weight;
    if (rand <= sum) return r;
  }
}

if (hasPlayedToday()) {
  spinBtn.disabled = true;
  result.innerText = "오늘은 이미 참여하셨습니다 😊";
}

spinBtn.addEventListener("click", () => {
  if (hasPlayedToday()) return;

  spinBtn.disabled = true;
  const reward = getReward();
  const rotation = 360 * 5 + reward.angle;

  wheel.style.transform = `rotate(${rotation}deg)`;

  setTimeout(() => {
    result.innerText = `🎁 ${reward.name} 당첨!`;
    notice.innerText = "※ 당첨 화면을 캡처하여 네이버폼으로 인증해 주세요.";
    const today = new Date().toISOString().slice(0, 10);
    localStorage.setItem("rouletteDate", today);
  }, 4000);
});
</script>

</body>
</html>
