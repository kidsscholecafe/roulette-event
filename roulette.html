<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>포인트 룰렛 이벤트</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  background: #f6f6f6;
  text-align: center;
  padding: 20px;
}

h1 { margin-bottom: 5px; }

#wheel-container {
  position: relative;
  width: 300px;
  height: 300px;
  margin: 30px auto;
}

#wheel {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 8px solid #333;
  background:
    conic-gradient(
      #FFD54F 0deg 216deg,     /* 5천P 60% */
      #4FC3F7 216deg 324deg,  /* 1만P 30% */
      #FF8A65 324deg 360deg   /* 5만P 10% */
    );
  transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
}

.pointer {
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 16px solid transparent;
  border-right: 16px solid transparent;
  border-bottom: 32px solid #ff3b3b;
}

.label {
  position: absolute;
  top: 50%;
  left: 50%;
  transform-origin: 0 0;
  font-size: 14px;
  font-weight: bold;
}

.label.p5000 {
  transform: rotate(108deg) translate(0, -120px);
}
.label.p10000 {
  transform: rotate(270deg) translate(0, -120px);
}
.label.p50000 {
  transform: rotate(342deg) translate(0, -120px);
}

button {
  background: #ff6b00;
  color: #fff;
  border: none;
  padding: 14px 28px;
  font-size: 18px;
  border-radius: 8px;
  cursor: pointer;
}
button:disabled { background: #aaa; }

#result {
  margin-top: 20px;
  font-size: 18px;
  font-weight: bold;
}
.notice {
  margin-top: 12px;
  font-size: 14px;
  color: #555;
}
</style>
</head>

<body>

<h1>🎡 포인트 룰렛 이벤트</h1>
<p>하루 1회 참여 가능</p>

<div id="wheel-container">
  <div class="pointer"></div>
  <div id="wheel"></div>

  <div class="label p5000">5천P</div>
  <div class="label p10000">1만P</div>
  <div class="label p50000">5만P</div>
</div>

<button id="spinBtn">룰렛 돌리기</button>

<div id="result"></div>
<div class="notice" id="notice"></div>

<script>
const spinBtn = document.getElementById("spinBtn");
const wheel = document.getElementById("wheel");
const result = document.getElementById("result");
const notice = document.getElementById("notice");

const rewards = [
  { name: "5천 포인트", weight: 60, angle: 108 },
  { name: "1만 포인트", weight: 30, angle: 270 },
  { name: "5만 포인트", weight: 10, angle: 342 }
];

function hasPlayedToday() {
  const saved = localStorage.getItem("rouletteDate");
  const today = new Date().toISOString().slice(0, 10);
  return saved === today;
}

function getReward() {
  const rand = Math.random() * 100;
  let sum = 0;
  for (let r of rewards) {
    sum += r.weight;
    if (rand <= sum) return r;
  }
}

if (hasPlayedToday()) {
  spinBtn.disabled = true;
  result.innerText = "오늘은 이미 참여하셨습니다 😊";
}

  if (hasPlayedToday()) return;
