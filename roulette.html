<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>포인트 룰렛 이벤트</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  text-align: center;
  background: #f7f7f7;
  padding: 20px;
}
h1 { margin-bottom: 10px; }
#wheel-container {
  position: relative;
  width: 280px;
  height: 280px;
  margin: 30px auto;
}
#wheel {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 8px solid #333;
  transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
}
.pointer {
  position: absolute;
  top: -15px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 15px solid transparent;
  border-right: 15px solid transparent;
  border-bottom: 30px solid #ff3b3b;
}
button {
  background: #ff6b00;
  color: #fff;
  border: none;
  padding: 14px 28px;
  font-size: 18px;
  border-radius: 8px;
  cursor: pointer;
}
button:disabled {
  background: #aaa;
  cursor: not-allowed;
}
#result {
  margin-top: 25px;
  font-size: 18px;
  font-weight: bold;
}
.notice {
  margin-top: 15px;
  font-size: 14px;
  color: #555;
}
</style>
</head>

<body>

<h1>🎉 포인트 룰렛 이벤트 🎉</h1>
<p>하루 1회 참여 가능</p>

<div id="wheel-container">
  <div class="pointer"></div>
  <svg id="wheel" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="50" fill="#fff"/>
    <path d="M50 50 L50 0 A50 50 0 0 1 93.3 25 Z" fill="#FFD54F"/>
    <path d="M50 50 L93.3 25 A50 50 0 0 1 93.3 75 Z" fill="#4FC3F7"/>
    <path d="M50 50 L93.3 75 A50 50 0 0 1 50 100 Z" fill="#FF8A65"/>
    <text x="65" y="20" font-size="6" text-anchor="middle">5천P</text>
    <text x="85" y="55" font-size="6" text-anchor="middle">1만P</text>
    <text x="65" y="90" font-size="6" text-anchor="middle">5만P</text>
  </svg>
</div>

<button id="spinBtn">룰렛 돌리기</button>

<div id="result"></div>
<div class="notice" id="notice"></div>

<script>
const rewards = ["5천 포인트", "1만 포인트", "5만 포인트"];
const angles = [330, 90, 210]; // 각 보상 위치
const spinBtn = document.getElementById("spinBtn");
const wheel = document.getElementById("wheel");
const result = document.getElementById("result");
const notice = document.getElementById("notice");

function hasPlayedToday() {
  const last = localStorage.getItem("rouletteDate");
  const today = new Date().toISOString().slice(0,10);
  return last === today;
}

if (hasPlayedToday()) {
  spinBtn.disabled = true;
  result.innerText = "오늘은 이미 참여하셨습니다 😊";
}

spinBtn.addEventListener("click", () => {
  if (hasPlayedToday()) return;

  spinBtn.disabled = true;
  const index = Math.floor(Math.random() * rewards.length);
  const rotation = 360 * 5 + angles[index];

  wheel.style.transform = `rotate(${rotation}deg)`;

  setTimeout(() => {
    result.innerText = `🎁 ${rewards[index]} 당첨!`;
    notice.innerText = "※ 당첨 화면 캡처 후 네이버폼으로 인증해 주세요.";
    const today = new Date().toISOString().slice(0,10);
    localStorage.setItem("rouletteDate", today);
  }, 4000);
});
</script>

</body>
</html>
