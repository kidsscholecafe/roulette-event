<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>룰렛 이벤트</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: linear-gradient(180deg, #fff6e5, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 360px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      padding: 24px 20px 28px;
      text-align: center;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 6px;
    }

    .desc {
      font-size: 13px;
      color: #666;
      margin-bottom: 18px;
    }

    .arrow {
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 26px solid #ff4d4d;
      margin: 0 auto -10px;
      z-index: 10;
      position: relative;
    }

    canvas {
      display: block;
      margin: 0 auto;
      background: #fff;
      border-radius: 50%;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px 0;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: #ff9800;
      color: #fff;
      cursor: pointer;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .notice {
      margin-top: 14px;
      font-size: 12px;
      color: #888;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎉 룰렛 이벤트</h1>
    <div class="desc">버튼을 눌러 포인트를 받아보세요!</div>

    <div class="arrow"></div>
    <canvas id="roulette" width="280" height="280"></canvas>

    <button id="spinBtn">룰렛 돌리기</button>

    <div class="notice">
      · 1인 1일 1회 참여 가능<br>
      · 당첨 화면 캡처 후 인증 필수
    </div>
  </div>

  <script>
    const canvas = document.getElementById("roulette");
    const ctx = canvas.getContext("2d");
    const btn = document.getElementById("spinBtn");

    const prizes = [
      { text: "5천 포인트", percent: 60, color: "#FFE082" },
      { text: "1만 포인트", percent: 30, color: "#81D4FA" },
      { text: "5만 포인트", percent: 10, color: "#FFAB91" }
    ];

    const total = prizes.reduce((a, b) => a + b.percent, 0);
    const center = canvas.width / 2;
    let currentAngle = 0;
    let spinning = false;

    function drawRoulette() {
      let startAngle = 0;

      prizes.forEach(p => {
        const slice = (p.percent / total) * Math.PI * 2;

        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, center, startAngle, startAngle + slice);
        ctx.fillStyle = p.color;
        ctx.fill();

        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(startAngle + slice / 2);
        ctx.textAlign = "right";
        ctx.font = "bold 13px Arial";
        ctx.fillStyle = "#333";
        ctx.fillText(p.text, center - 12, 4);
        ctx.restore();

        startAngle += slice;
      });
    }

    function spin() {
      if (spinning) return;
      spinning = true;
      btn.disabled = true;

      const spinAngle = Math.random() * 360 + 1440;
      const duration = 2800;
      const start = performance.now();

      function animate(now) {
        const progress = Math.min((now - start) / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        currentAngle = spinAngle * ease;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(center, center);
        ctx.rotate((currentAngle * Math.PI) / 180);
        ctx.translate(-center, -center);
        drawRoulette();
        ctx.restore();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          showResult();
        }
      }

      requestAnimationFrame(animate);
    }

    function showResult() {
      const angle = (360 - (currentAngle % 360)) % 360;
      let acc = 0;

      for (const p of prizes) {
        acc += (p.percent / total) * 360;
        if (angle <= acc) {
          alert(`🎉 ${p.text} 당첨!\n\n화면을 캡처해서 네이버폼으로 인증해주세요.`);
          break;
        }
      }

      spinning = false;
    }

    drawRoulette();
    btn.addEventListener("click", spin);
  </script>

</body>
</html>
