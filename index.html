<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>룰렛 이벤트</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: Pretendard, Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .wrapper {
      text-align: center;
    }

    .arrow {
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 22px solid #e53935;
      margin: 0 auto -8px;
      z-index: 10;
      position: relative;
    }

    canvas {
      background: #fff;
      border-radius: 50%;
    }

    button {
      margin-top: 20px;
      padding: 14px 28px;
      font-size: 16px;
      border: none;
      border-radius: 30px;
      background: #ff9800;
      color: #fff;
      cursor: pointer;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="arrow"></div>
    <canvas id="roulette" width="320" height="320"></canvas>
    <button id="spinBtn">룰렛 돌리기</button>
  </div>

  <script>
    const canvas = document.getElementById("roulette");
    const ctx = canvas.getContext("2d");
    const btn = document.getElementById("spinBtn");

    const prizes = [
      { text: "5천 포인트", percent: 60, color: "#FFD54F" },
      { text: "1만 포인트", percent: 30, color: "#4FC3F7" },
      { text: "5만 포인트", percent: 10, color: "#FF8A65" }
    ];

    const total = prizes.reduce((sum, p) => sum + p.percent, 0);
    const center = canvas.width / 2;
    let currentAngle = 0;
    let spinning = false;

    function drawRoulette() {
      let startAngle = 0;

      prizes.forEach(p => {
        const sliceAngle = (p.percent / total) * Math.PI * 2;

        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, center, startAngle, startAngle + sliceAngle);
        ctx.fillStyle = p.color;
        ctx.fill();

        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.font = "bold 14px Arial";
        ctx.fillStyle = "#000";
        ctx.fillText(p.text, center - 12, 5);
        ctx.restore();

        startAngle += sliceAngle;
      });
    }

    function spin() {
      if (spinning) return;
      spinning = true;
      btn.disabled = true;

      const spinAngle = Math.random() * 360 + 1440;
      const duration = 3000;
      const start = performance.now();

      function animate(now) {
        const progress = Math.min((now - start) / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        currentAngle = spinAngle * ease;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(center, center);
        ctx.rotate((currentAngle * Math.PI) / 180);
        ctx.translate(-center, -center);
        drawRoulette();
        ctx.restore();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          showResult();
        }
      }

      requestAnimationFrame(animate);
    }

    function showResult() {
      const angle = (360 - (currentAngle % 360)) % 360;
      let acc = 0;

      for (const p of prizes) {
        acc += (p.percent / total) * 360;
        if (angle <= acc) {
          alert(`🎉 ${p.text} 당첨!\n\n화면을 캡처해서 인증해주세요.`);
          break;
        }
      }

      spinning = false;
    }

    drawRoulette();
    btn.addEventListener("click", spin);
  </script>

</body>
</html>
